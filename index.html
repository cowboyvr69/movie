<!--
CineVerse Ultimate
Single-file advanced movie web app starter

FEATURES INCLUDED
- Netflix-style UI
- TMDB movie search
- Trending movies
- Hero banner
- Trailer modal
- Dark/light mode
- Favorites system
- LocalStorage persistence
- Responsive mobile design
- Animated cards
- Watchlist
- GitHub Pages ready

SETUP
1. Save as index.html
2. Replace YOUR_TMDB_API_KEY with your TMDB API key
3. Upload to GitHub Pages

GET FREE TMDB API KEY:
https://www.themoviedb.org/settings/api
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineVerse Ultimate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0b0b0f;
    --card:#16161d;
    --text:#ffffff;
    --accent:#ff0055;
    --accent2:#7b2dff;
}

.light{
    --bg:#f2f2f2;
    --card:#ffffff;
    --text:#111111;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    transition:0.3s;
}

/* NAV */

nav{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    padding:16px 40px;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:2rem;
    font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.nav-right{
    display:flex;
    gap:15px;
    align-items:center;
}

.search{
    padding:10px 15px;
    border:none;
    border-radius:30px;
    width:240px;
    outline:none;
}

.toggle{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:30px;
    cursor:pointer;
}

/* HERO */

.hero{
    height:90vh;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.9)),
    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2000&auto=format&fit=crop')
    center/cover;
    display:flex;
    align-items:center;
    padding:0 8%;
}

.hero-content{
    max-width:700px;
}

.hero h1{
    font-size:4rem;
    margin-bottom:20px;
}

.hero p{
    line-height:1.8;
    margin-bottom:30px;
    color:#ddd;
}

.hero-buttons{
    display:flex;
    gap:15px;
}

.btn{
    padding:14px 24px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.btn-primary{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:white;
}

.btn-secondary{
    background:#222;
    color:white;
}

.btn:hover{
    transform:scale(1.05);
}

/* SECTION */

.section{
    padding:60px 6%;
}

.section-title{
    font-size:2rem;
    margin-bottom:25px;
}

/* MOVIES */

.movies{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    transition:0.3s;
    position:relative;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 30px rgba(123,45,255,0.4);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card-content{
    padding:18px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    font-size:0.9rem;
    color:#bbb;
    margin-bottom:15px;
}

.card-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.small-btn{
    border:none;
    padding:10px 14px;
    border-radius:25px;
    cursor:pointer;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:white;
    font-size:0.85rem;
}

/* FAVORITES */

.favorites{
    margin-top:40px;
}

/* MODAL */

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    width:90%;
    max-width:900px;
    background:#000;
    border-radius:20px;
    overflow:hidden;
}

.close{
    color:white;
    float:right;
    padding:15px;
    cursor:pointer;
    font-size:1.5rem;
}

/* FOOTER */

footer{
    padding:40px;
    text-align:center;
    color:#888;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
    font-size:2.5rem;
}

nav{
    flex-direction:column;
    gap:15px;
}

.search{
    width:100%;
}

}

</style>
</head>

<body>

<!-- NAV -->

<nav>

<div class="logo">CineVerse</div>

<div class="nav-right">
<input
type="text"
class="search"
id="searchInput"
placeholder="Search movies..."
>

<button class="toggle" onclick="toggleTheme()">
Theme
</button>
</div>

</nav>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<h1>Unlimited Movies & Entertainment</h1>

<p>
Discover trending movies, build your watchlist,
save favorites, and explore cinematic worlds
with a beautiful Netflix-inspired experience.
</p>

<div class="hero-buttons">
<button class="btn btn-primary">
Start Watching
</button>

<button class="btn btn-secondary">
My List
</button>
</div>

</div>
</section>

<!-- TRENDING -->

<section class="section">

<h2 class="section-title">Trending Movies</h2>

<div class="movies" id="movieContainer">
</div>

</section>

<!-- FAVORITES -->

<section class="section favorites">

<h2 class="section-title">Favorites</h2>

<div class="movies" id="favoritesContainer">
</div>

</section>

<!-- TRAILER MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<div class="close" onclick="closeModal()">
✕
</div>

<iframe
id="trailer"
width="100%"
height="500"
src=""
frameborder="0"
allowfullscreen>
</iframe>

</div>

</div>

<footer>
© 2026 CineVerse Ultimate
</footer>

<script>

const API_KEY = "YOUR_TMDB_API_KEY";

const movieContainer =
document.getElementById("movieContainer");

const favoritesContainer =
document.getElementById("favoritesContainer");

const searchInput =
document.getElementById("searchInput");

const modal =
document.getElementById("modal");

const trailer =
document.getElementById("trailer");

/* THEME */

function toggleTheme(){
document.body.classList.toggle("light");
}

/* FETCH TRENDING */

async function getTrending(){

const res = await fetch(
`https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}`
);

const data = await res.json();

displayMovies(data.results);

}

function displayMovies(movies){

movieContainer.innerHTML = "";

movies.forEach(movie => {

const card = document.createElement("div");

card.classList.add("card");

card.innerHTML = `
<img src="https://image.tmdb.org/t/p/w500${movie.poster_path}">

<div class="card-content">

<h3>${movie.title}</h3>

<p>
⭐ ${movie.vote_average}
</p>

<div class="card-buttons">

<button class="small-btn"
onclick="watchTrailer(${movie.id})">
Trailer
</button>

<button class="small-btn"
onclick='saveFavorite(
${JSON.stringify(movie)}
)'>
Favorite
</button>

</div>

</div>
`;

movieContainer.appendChild(card);

});

}

/* SEARCH */

searchInput.addEventListener("keyup", async (e)=>{

if(e.target.value.length < 2){
getTrending();
return;
}

const res = await fetch(
`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${e.target.value}`
);

const data = await res.json();

displayMovies(data.results);

});

/* FAVORITES */

function saveFavorite(movie){

let favorites =
JSON.parse(localStorage.getItem("favorites"))
|| [];

favorites.push(movie);

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

loadFavorites();

}

function loadFavorites(){

const favorites =
JSON.parse(localStorage.getItem("favorites"))
|| [];

favoritesContainer.innerHTML = "";

favorites.forEach(movie=>{

const card = document.createElement("div");

card.classList.add("card");

card.innerHTML = `
<img src="https://image.tmdb.org/t/p/w500${movie.poster_path}">

<div class="card-content">

<h3>${movie.title}</h3>

<p>Saved to watchlist</p>

</div>
`;

favoritesContainer.appendChild(card);

});

}

/* TRAILERS */

async function watchTrailer(id){

const res = await fetch(
`https://api.themoviedb.org/3/movie/${id}/videos?api_key=${API_KEY}`
);

const data = await res.json();

const trailerData =
data.results.find(
vid => vid.type === "Trailer"
);

if(trailerData){

trailer.src =
`https://www.youtube.com/embed/${trailerData.key}`;

modal.style.display = "flex";

}

}

function closeModal(){

modal.style.display = "none";

trailer.src = "";

}

/* INIT */

getTrending();
loadFavorites();

</script>

</body>
</html>
